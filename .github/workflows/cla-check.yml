name: Contributor License Agreement (CLA) Check

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla-check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Contributor License Agreement
        if: (github.event_name == 'pull_request_target') || (github.event_name == 'issue_comment' && github.event.issue.pull_request)
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: '.github/cla-signatures.json'
          path-to-document: 'https://github.com/felixmwiya200/CALPHADHEACalc/blob/main/CLA.md'
          branch: 'main'
          allowlist: felixmwiya200,bot*
          custom-notsigned-prcomment: |
            Thank you for your pull request!

            Before we can merge your submission, all outside contributors must review and accept the [CALPHADHEACalc Contributor License Agreement (CLA)](https://github.com/felixmwiya200/CALPHADHEACalc/blob/main/CLA.md).

            To sign the CLA, please reply to this comment with the exact phrase:
            > I have read the CALPHADHEACalc Contributor License Agreement and I hereby agree to its terms.
          custom-pr-sign-comment: 'I have read the CALPHADHEACalc Contributor License Agreement and I hereby agree to its terms.'
